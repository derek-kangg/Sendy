# Sendy on Fly.io: one always-on Machine with a small volume for routes.
# Step-by-step in docs/deploy.md. `fly launch` rewrites `app` if the name is taken.
app = "sendy"
primary_region = "sea"   # Seattle — closest region to Vancouver

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  SENDY_DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Never stop the Machine: a climber at the wall should not wait for a cold start.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    # Streamlit holds one WebSocket per open tab, so count connections.
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/_stcore/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[mounts]
  source = "sendy_data"
  destination = "/data"
  initial_size = "1gb"
